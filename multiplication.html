<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乘法進攻：籃球大戰</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#1f3a5f,#2c3e50);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#fff;text-align:center;padding:16px}
h1{margin:6px 0 12px;font-size:clamp(24px,4vw,40px);text-shadow:2px 3px 0 #000}
.court{position:relative;max-width:1000px;margin:0 auto;border:5px solid #fff;border-radius:18px;background:
repeating-linear-gradient(90deg,#e67e22 0 60px,#dd761c 60px 120px);padding:22px 70px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
.court::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:#fff}
.circle{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border:10px solid #fff;border-radius:50%}
.hoop{position:absolute;top:50%;width:64px;height:110px;margin-top:-55px;background:#333;border-bottom:6px solid #e00;z-index:1}
.hoop::after{content:"";position:absolute;top:10px;width:12px;height:70px;background:#fff}
.hoop.l{left:0;border-radius:0 10px 10px 0}.hoop.l::after{left:0}
.hoop.r{right:0;border-radius:10px 0 0 10px}.hoop.r::after{right:0}
.teams{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px;z-index:2}
.card{background:rgba(30,40,55,.88);border-radius:16px;padding:14px 10px;position:relative}
#cA{border-top:8px solid #3498db}#cB{border-top:8px solid #e74c3c}
.card h2{margin:0;font-size:24px}
.q{font-size:clamp(40px,8vw,72px);font-weight:900;color:#f5c518;text-shadow:3px 3px 0 #c0561b;margin:6px 0}
.fb{height:30px;font-size:20px;font-weight:700}
.ok{color:#2ecc71}.no{color:#ff7675}
input{width:130px;font-size:30px;text-align:center;border:0;border-radius:10px;padding:6px;margin:4px 0}
.btn{display:block;margin:6px auto 0;border:0;border-radius:20px;background:#3498db;color:#fff;font-size:16px;padding:8px 18px;cursor:pointer}
#cB .btn{background:#e74c3c}
.hint{font-size:13px;opacity:.8;margin-top:4px}
.score{margin-top:12px;background:#fff;color:#222;border-radius:14px;padding:6px;font-size:22px;font-weight:800;position:relative;z-index:2}
.score b{font-size:40px;color:#e67e22}
.ball{position:absolute;left:50%;top:50%;font-size:40px;opacity:0;pointer-events:none}
.shootA{animation:sA .9s ease-out}.shootB{animation:sB .9s ease-out}
@keyframes sA{0%{opacity:1;transform:translate(-50%,-50%)}50%{opacity:1;transform:translate(-190%,-190%) rotate(360deg)}100%{opacity:0;transform:translate(-330%,-90%) rotate(720deg)}}
@keyframes sB{0%{opacity:1;transform:translate(-50%,-50%)}50%{opacity:1;transform:translate(90%,-190%) rotate(-360deg)}100%{opacity:0;transform:translate(230%,-90%) rotate(-720deg)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:210px;margin:8px auto 0}
.pad button{border:0;border-radius:10px;font-size:24px;font-weight:800;padding:9px 0;background:#ecf0f1;color:#222;cursor:pointer;box-shadow:0 3px 0 #95a5a6}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #95a5a6}
.pad .del{background:#f5b041}.pad .go{background:#2ecc71;color:#fff;box-shadow:0 3px 0 #1e8449}
#start{margin:18px auto 0;font-size:22px;padding:12px 34px;background:#f39c12;border:0;border-radius:30px;color:#fff;cursor:pointer;font-weight:700}
@media(max-width:700px){.court{padding:16px 36px}.hoop{width:30px}.teams{gap:10px}.circle{display:none}input{width:100px}}
</style>
</head>
<body>
<h1>🏀 乘法進攻：籃球大戰 🏀</h1>
<div class="court">
  <div class="hoop l"></div><div class="hoop r"></div><div class="circle"></div>
  <div class="teams">
    <div class="card" id="cA"><h2>A組</h2><div class="q" id="qA">? × ?</div><div class="fb" id="fA"></div>
      <input id="iA" readonly inputmode="none" placeholder="?" autocomplete="off">
      <div class="pad" id="pA"></div><span class="ball" id="bA">🏀</span></div>
    <div class="card" id="cB"><h2>B組</h2><div class="q" id="qB">? × ?</div><div class="fb" id="fB"></div>
      <input id="iB" readonly inputmode="none" placeholder="?" autocomplete="off">
      <div class="pad" id="pB"></div><span class="ball" id="bB">🏀</span></div>
  </div>
</div>
<div class="teams" style="max-width:1000px;margin:12px auto 0;padding:0 70px">
  <div class="score">A組得分 <b id="sA">0</b></div><div class="score">B組得分 <b id="sB">0</b></div>
</div>
<button id="start" onclick="startGame()">開始比賽</button>
<script>
var T={A:{s:0,a:0,b:0,lock:false},B:{s:0,a:0,b:0,lock:false}},on=false;
function $(i){return document.getElementById(i)}
function rnd(){return Math.floor(Math.random()*11)}
function newQ(k){
  var o=k=='A'?'B':'A',a,b;
  do{a=rnd();b=rnd()}while((a==T[k].a&&b==T[k].b)||(a==T[o].a&&b==T[o].b));
  T[k].a=a;T[k].b=b;T[k].lock=false;
  $('q'+k).textContent=a+' × '+b;$('f'+k).textContent='';$('f'+k).className='fb';
  $('i'+k).value='';
}
function startGame(){
  on=true;T.A.a=T.A.b=T.B.a=T.B.b=-1;
  ['A','B'].forEach(function(k){T[k].s=0;$('s'+k).textContent=0;newQ(k)});
  $('start').textContent='重新開始';
}
function submit(k){
  var t=T[k],i=$('i'+k),f=$('f'+k);
  if(!on||t.lock||i.value==='')return;
  t.lock=true;
  if(parseInt(i.value,10)===t.a*t.b){
    t.s++;$('s'+k).textContent=t.s;f.textContent='✓ 答啱！+1分';f.className='fb ok';
    var b=$('b'+k);b.className='ball';void b.offsetWidth;b.className='ball shoot'+k;
  }else{
    f.textContent='✗ 答案係 '+t.a*t.b;f.className='fb no';
  }
  setTimeout(function(){newQ(k)},1200);
}
function press(k,d){
  var i=$('i'+k);
  if(!on||T[k].lock)return;
  if(d=='del')i.value=i.value.slice(0,-1);
  else if(i.value.length<3)i.value+=d;
}
['A','B'].forEach(function(k){
  var p=$('p'+k),keys=['1','2','3','4','5','6','7','8','9','del','0','go'];
  keys.forEach(function(d){
    var b=document.createElement('button');
    b.type='button';
    b.textContent=d=='del'?'⌫':d=='go'?'✓':d;
    if(d=='del')b.className='del';
    if(d=='go')b.className='go';
    b.onclick=function(){d=='go'?submit(k):press(k,d)};
    p.appendChild(b);
  });
});
</script>
</body>
</html>
